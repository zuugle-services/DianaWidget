name: Deploy dev

# Every push to `dev` replaces the dev bundle (dist/DianaWidget.bundle-dev.js, used by index-demo-dev.html).
# Customers' embeds are untouched. Any other ref: `gh workflow run release.yml -f ref=<ref> -f channel=dev`.
on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  deploy:
    uses: ./.github/workflows/release.yml
    with:
      ref: ${{ github.sha }}
      channel: dev
    secrets: inherit
