name: Release Please

# On every push to main, release-please keeps one release PR up to date: it bumps `version` in
# package.json (+ package-lock.json) and writes CHANGELOG.md from the conventional-commit PR titles since the
# last release. Merging that PR creates the tag + GitHub Release, and this workflow then deploys it.
# Manual deploys / rollbacks: run release.yml via workflow_dispatch with a ref.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    # Self-hosted by default; ACTIONS_RUNNER = "ubuntu-latest" switches to GitHub's runners (see release.yml).
    runs-on: ${{ fromJSON(vars.ACTIONS_RUNNER || '"self-hosted"') }}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  deploy:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/release.yml
    with:
      ref: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
