name: Deploy

# Builds a ref and uploads it via SFTP to the widget host, then checks the public URL serves exactly that build.
# Three ways in, one deploy:
# - workflow_call from release-please.yml after merging the release PR created a release (releases created
#   with GITHUB_TOKEN do not fire `release: published`, so there is no release trigger) -> production.
# - workflow_call from deploy-dev.yml (push to `dev`) -> the dev bundle.
# - workflow_dispatch: manual deploy, re-deploy or rollback of any branch, tag or commit to either channel.
#
# production: dist/DianaWidget.bundle.js (what customers embed), dist/DianaWidget.bundle-X.Y.Z.js (pinned,
#             never overwritten by a later release), index-demo.html, index.php; bundle attached to the release.
# dev:        dist/DianaWidget.bundle-dev.js, index-demo-dev.html, index-dev.php.
#
# Runner: the company's self-hosted runner (label `self-hosted`, the same one DianaProxy and me2ski use) by
# default. GitHub has no automatic fallback between runner kinds, so the fallback to GitHub's runners is a switch:
#   one run:    "Run workflow" with runner = github-hosted (gh workflow run release.yml -f runner=github-hosted ...)
#   every run:  repository variable ACTIONS_RUNNER = "ubuntu-latest" (JSON: a label or a list of labels)
# The self-hosted runner is persistent and needs curl, sha256sum and Docker (the SFTP upload is a Docker action).
on:
  workflow_call:
    inputs:
      ref:
        description: Git ref (tag, branch or commit) to deploy
        required: true
        type: string
      channel:
        description: production or dev
        required: false
        default: production
        type: string
      runner:
        description: self-hosted (default) or github-hosted
        required: false
        default: self-hosted
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref (tag, branch or commit) to deploy, e.g. v1.16.0 or main
        required: true
        default: main
        type: string
      channel:
        description: Where to deploy it
        required: true
        default: production
        type: choice
        options: [production, dev]
      runner:
        description: Runner (github-hosted is the fallback when the self-hosted runner is down)
        required: true
        default: self-hosted
        type: choice
        options: [self-hosted, github-hosted]

# Never two uploads to the same channel at once; a second one waits for the first.
concurrency:
  group: deploy-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ${{ fromJSON(inputs.runner == 'github-hosted' && '"ubuntu-latest"' || vars.ACTIONS_RUNNER || '"self-hosted"') }}
    timeout-minutes: 20
    permissions:
      contents: write  # attach the bundle to the GitHub Release
    env:
      CHANNEL: ${{ inputs.channel }}
      REF: ${{ inputs.ref }}
      BASE_URL: ${{ vars.WIDGET_BASE_URL || 'https://diana.zuugle-services.net' }}
    steps:
      - name: Validate channel
        run: |
          case "$CHANNEL" in
            production|dev) ;;
            *) echo "::error::unknown channel: $CHANNEL"; exit 1 ;;
          esac

      # GitHub's runners have all of these; the self-hosted one must have them installed.
      - name: Check the runner has the deploy tools
        run: |
          missing=""
          for tool in git curl sha256sum docker; do
            command -v "$tool" >/dev/null 2>&1 || missing="$missing $tool"
          done
          if [ -n "$missing" ]; then
            echo "::error::runner '$RUNNER_NAME' lacks:$missing. Install them there, or run with runner = github-hosted."
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      # Set up inline: the setup action may not exist in the deployed ref (rollback to an old tag).
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Lint and tests
        run: |
          npm run lint
          npm test

      - name: Production build
        run: npm run build

      - name: Stage files
        id: stage
        run: |
          version=$(node -p "require('./package.json').version")
          commit=$(git rev-parse HEAD)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          if [ "$CHANNEL" = production ]; then
            cp dist/DianaWidget.bundle.js "dist/DianaWidget.bundle-$version.js"
            echo "check=DianaWidget.bundle.js DianaWidget.bundle-$version.js" >> "$GITHUB_OUTPUT"
          else
            cp dist/DianaWidget.bundle.js dist/DianaWidget.bundle-dev.js
            echo "check=DianaWidget.bundle-dev.js" >> "$GITHUB_OUTPUT"
          fi
          head -1 dist/DianaWidget.bundle.js

      # --- production ---------------------------------------------------------------------------------------
      # Pinned file first, so it exists before the unversioned one flips to the new release.
      - name: Upload versioned bundle
        if: env.CHANNEL == 'production'
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.FTP_USERNAME }}
          server: ${{ secrets.FTP_SERVER }}
          port: ${{ secrets.FTP_PORT }}
          password: ${{ secrets.FTP_PASSWORD }}
          sftp_only: true
          local_path: ./dist/DianaWidget.bundle-${{ steps.stage.outputs.version }}.js
          remote_path: ./dist/

      - name: Upload bundle
        if: env.CHANNEL == 'production'
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.FTP_USERNAME }}
          server: ${{ secrets.FTP_SERVER }}
          port: ${{ secrets.FTP_PORT }}
          password: ${{ secrets.FTP_PASSWORD }}
          sftp_only: true
          local_path: ./dist/DianaWidget.bundle.js
          remote_path: ./dist/

      - name: Upload index-demo.html
        if: env.CHANNEL == 'production'
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.FTP_USERNAME }}
          server: ${{ secrets.FTP_SERVER }}
          port: ${{ secrets.FTP_PORT }}
          password: ${{ secrets.FTP_PASSWORD }}
          sftp_only: true
          local_path: ./index-demo.html
          remote_path: ./

      - name: Upload index.php
        if: env.CHANNEL == 'production'
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.FTP_USERNAME }}
          server: ${{ secrets.FTP_SERVER }}
          port: ${{ secrets.FTP_PORT }}
          password: ${{ secrets.FTP_PASSWORD }}
          sftp_only: true
          local_path: ./index.php
          remote_path: ./

      # --- dev ----------------------------------------------------------------------------------------------
      - name: Upload dev bundle
        if: env.CHANNEL == 'dev'
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.FTP_USERNAME }}
          server: ${{ secrets.FTP_SERVER }}
          port: ${{ secrets.FTP_PORT }}
          password: ${{ secrets.FTP_PASSWORD }}
          sftp_only: true
          local_path: ./dist/DianaWidget.bundle-dev.js
          remote_path: ./dist/

      - name: Upload index-demo-dev.html
        if: env.CHANNEL == 'dev'
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.FTP_USERNAME }}
          server: ${{ secrets.FTP_SERVER }}
          port: ${{ secrets.FTP_PORT }}
          password: ${{ secrets.FTP_PASSWORD }}
          sftp_only: true
          local_path: ./index-demo-dev.html
          remote_path: ./

      - name: Upload index-dev.php
        if: env.CHANNEL == 'dev'
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.FTP_USERNAME }}
          server: ${{ secrets.FTP_SERVER }}
          port: ${{ secrets.FTP_PORT }}
          password: ${{ secrets.FTP_PASSWORD }}
          sftp_only: true
          local_path: ./index-dev.php
          remote_path: ./

      # The public URL must serve byte-for-byte what was just built (cache-busting query, retried ~1 min).
      - name: Smoke check
        env:
          FILES: ${{ steps.stage.outputs.check }}
          COMMIT: ${{ steps.stage.outputs.commit }}
        run: |
          expected=$(sha256sum dist/DianaWidget.bundle.js | cut -d' ' -f1)
          for f in $FILES; do
            url="$BASE_URL/dist/$f"
            ok=false
            for i in 1 2 3 4 5 6; do
              actual=$( (curl -fsSL "$url?v=$COMMIT" || true) | sha256sum | cut -d' ' -f1)
              if [ "$actual" = "$expected" ]; then ok=true; break; fi
              echo "attempt $i: $url does not serve the new build yet"
              sleep 10
            done
            if [ "$ok" != true ]; then
              echo "::error::$url does not serve the deployed build"
              exit 1
            fi
            echo "OK $url"
          done

      # An action instead of the gh CLI, which the self-hosted runner need not have.
      - name: Attach bundle to the GitHub Release
        if: env.CHANNEL == 'production' && startsWith(inputs.ref, 'v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.ref }}
          files: dist/DianaWidget.bundle-${{ steps.stage.outputs.version }}.js
          overwrite_files: true

      - name: Summary
        env:
          FILES: ${{ steps.stage.outputs.check }}
          VERSION: ${{ steps.stage.outputs.version }}
          COMMIT: ${{ steps.stage.outputs.commit }}
        run: |
          {
            echo "## Deployed $CHANNEL: v$VERSION (commit ${COMMIT:0:7}, ref $REF)"
            for f in $FILES; do echo "- $BASE_URL/dist/$f"; done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v5
        with:
          name: diana-widget-${{ inputs.channel }}-${{ steps.stage.outputs.version }}
          path: dist/
