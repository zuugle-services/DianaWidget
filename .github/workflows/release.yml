name: Deploy

# Builds a ref, uploads the bundle to the Bunny CDN (storage zone $BUNNY_STORAGE_ZONE, served as $CDN_URL and as
# $BASE_URL) and the demo via SFTP to the demo host, then checks that the public URLs serve exactly that build.
# Three ways in, one deploy:
# - workflow_call from release-please.yml after merging the release PR created a release (releases created
#   with GITHUB_TOKEN do not fire `release: published`, so there is no release trigger) -> production.
# - workflow_call from deploy-dev.yml (push to `dev`) -> the dev bundle.
# - workflow_dispatch: manual deploy, re-deploy or rollback of any branch, tag or commit to either channel.
#
# production: dist/DianaWidget.bundle.js (what customers embed), dist/DianaWidget.bundle-X.Y.Z.js (pinned,
#             never overwritten by a later release), demo/ (index.php, index-demo.html,
#             oauth2_functions.php: the demo, $DEMO_URL); bundle attached to the release; on the CDN also
#             index.html, the landing page listing the versions in storage (cdn/index.html, cdn/render-index.mjs).
# dev:        dist/DianaWidget.bundle-dev.js, demo/ (index-dev.php, index-demo-dev.html, oauth2_functions.php:
#             the password-protected dev demo, ${DEMO_URL}index-dev.php).
on:
  workflow_call:
    inputs:
      ref:
        description: Git ref (tag, branch or commit) to deploy
        required: true
        type: string
      channel:
        description: production or dev
        required: false
        default: production
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref (tag, branch or commit) to deploy, e.g. v1.16.0 or main
        required: true
        default: main
        type: string
      channel:
        description: Where to deploy it
        required: true
        default: production
        type: choice
        options: [production, dev]

# Never two uploads to the same channel at once; a second one waits for the first.
concurrency:
  group: deploy-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write  # attach the bundle to the GitHub Release
    env:
      CHANNEL: ${{ inputs.channel }}
      REF: ${{ inputs.ref }}
      BASE_URL: ${{ vars.WIDGET_BASE_URL || 'https://diana.zuugle-services.net' }}
      DEMO_URL: ${{ vars.WIDGET_DEMO_URL || 'https://demo.zuugle-services.net/' }}
      # Bunny CDN: the pull zone serves the storage zone at $CDN_URL and at $BASE_URL (CNAME to the pull zone).
      CDN_URL: ${{ vars.WIDGET_CDN_URL || 'https://diana-widget-eu.b-cdn.net' }}
      BUNNY_STORAGE_HOST: ${{ vars.BUNNY_STORAGE_HOST || 'storage.bunnycdn.com' }}
      BUNNY_STORAGE_ZONE: ${{ vars.BUNNY_STORAGE_ZONE || 'diana-widget-eu' }}
    steps:
      - name: Validate channel
        run: |
          case "$CHANNEL" in
            production|dev) ;;
            *) echo "::error::unknown channel: $CHANNEL"; exit 1 ;;
          esac

      - name: Check CDN credentials
        env:
          STORAGE_KEY: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
          API_KEY: ${{ secrets.BUNNY_API_KEY }}
        run: |
          [ -n "$STORAGE_KEY" ] || { echo "::error::secret BUNNY_STORAGE_PASSWORD (storage zone password) is not set"; exit 1; }
          [ -n "$API_KEY" ] || { echo "::error::secret BUNNY_API_KEY (account API key, for the cache purge) is not set"; exit 1; }

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      # Set up inline: the setup action may not exist in the deployed ref (rollback to an old tag).
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Lint and tests
        run: |
          npm run lint
          npm test

      - name: Production build
        run: npm run build

      - name: Stage files
        id: stage
        run: |
          version=$(jq -r .version package.json)
          commit=$(git rev-parse HEAD)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          if [ "$CHANNEL" = production ]; then
            cp dist/DianaWidget.bundle.js "dist/DianaWidget.bundle-$version.js"
            echo "check=DianaWidget.bundle.js DianaWidget.bundle-$version.js" >> "$GITHUB_OUTPUT"
          else
            cp dist/DianaWidget.bundle.js dist/DianaWidget.bundle-dev.js
            echo "check=DianaWidget.bundle-dev.js" >> "$GITHUB_OUTPUT"
          fi
          head -1 dist/DianaWidget.bundle.js

      # --- Bunny CDN (both channels) ------------------------------------------------------------------------
      # The landing page template comes from the commit this workflow runs from, not from the deployed ref,
      # so a rollback to an old tag still renders the current page.
      - name: Check out the CDN landing page
        if: env.CHANNEL == 'production'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: .cdn-page
          sparse-checkout: cdn
          persist-credentials: false

      # Pinned file first, so it exists before the unversioned one flips to the new release; the landing page
      # last, rendered from the storage listing so it shows exactly the versions that can be loaded.
      - name: Upload to Bunny Storage
        env:
          ACCESS_KEY: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.stage.outputs.version }}
        run: |
          storage="https://$BUNNY_STORAGE_HOST/$BUNNY_STORAGE_ZONE"
          put() {  # put <local file> <path in the storage zone>; Bunny rejects the upload if the checksum differs
            sum=$(sha256sum "$1" | cut -d' ' -f1 | tr a-f A-F)
            curl --fail-with-body -sS -o /dev/null -X PUT -H "AccessKey: $ACCESS_KEY" -H "Checksum: $sum" \
              -H "Content-Type: application/octet-stream" --data-binary "@$1" "$storage/$2"
            echo "uploaded $2"
          }
          if [ "$CHANNEL" = production ]; then
            put "dist/DianaWidget.bundle-$VERSION.js" "dist/DianaWidget.bundle-$VERSION.js"
            put dist/DianaWidget.bundle.js dist/DianaWidget.bundle.js
            mkdir -p cdn-out
            curl --fail-with-body -sS -H "AccessKey: $ACCESS_KEY" -H "Accept: application/json" "$storage/dist/" \
              > cdn-out/listing.json
            gh release list --limit 1000 --exclude-drafts --json tagName,publishedAt > cdn-out/releases.json
            node .cdn-page/cdn/render-index.mjs --listing cdn-out/listing.json --releases cdn-out/releases.json \
              --current "$VERSION" --out cdn-out/index.html
            put cdn-out/index.html index.html
          else
            put dist/DianaWidget.bundle-dev.js dist/DianaWidget.bundle-dev.js
          fi

      # Required: Bunny does not purge its edge cache when a storage file is replaced, and the pull zone ignores query
      # strings. So the changed URLs are purged explicitly, on both hostnames. Browser caching is a pull zone edge rule
      # (5 min for the unversioned files), see docs/DOCUMENTATION.md.
      - name: Purge CDN cache
        env:
          API_KEY: ${{ secrets.BUNNY_API_KEY }}
          FILES: ${{ steps.stage.outputs.check }}
        run: |
          paths=$(for f in $FILES; do echo "dist/$f"; done)
          if [ "$CHANNEL" = production ]; then paths="$paths index.html /"; fi
          for host in $CDN_URL $BASE_URL; do
            for p in $paths; do
              url="$host/${p#/}"
              curl --fail-with-body -sS -o /dev/null -X POST -H "AccessKey: $API_KEY"                 "https://api.bunny.net/purge?url=$(jq -rn --arg u "$url" '$u|@uri')"
              echo "purged $url"
            done
          done

      # --- demo (both channels) -----------------------------------------------------------------------------
      # Everything demo-related lives in /demo/, served as its own host ($DEMO_URL), so the pages load the bundle
      # by absolute URL. Kept on the server only, never in the repo: client_id_secret.php, .htaccess (password
      # protection of the dev pages) and the .htpasswd it points to.
      # Uploading the directory makes sftp create /demo/ if it does not exist yet.
      - name: Stage demo
        run: |
          if [ "$CHANNEL" = production ]; then php=index.php; html=index-demo.html; bundle=DianaWidget.bundle.js
          else php=index-dev.php; html=index-demo-dev.html; bundle=DianaWidget.bundle-dev.js; fi
          mkdir -p deploy/demo
          cp "$php" oauth2_functions.php deploy/demo/
          sed "s#src=\"\./dist/#src=\"$BASE_URL/dist/#" "$html" > "deploy/demo/$html"
          grep -qF "src=\"$BASE_URL/dist/$bundle\"" "deploy/demo/$html" \
            || { echo "::error::$html does not load ./dist/$bundle"; exit 1; }
          ls -l deploy/demo

      - name: Upload demo
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.FTP_USERNAME }}
          server: ${{ secrets.FTP_SERVER }}
          port: ${{ secrets.FTP_PORT }}
          password: ${{ secrets.FTP_PASSWORD }}
          sftp_only: true
          local_path: ./deploy/demo
          remote_path: ./

      # The CDN and the public URL must serve byte-for-byte what was just built. No cache-busting query: the purge
      # has to have worked (retried ~1 min).
      - name: Smoke check
        env:
          FILES: ${{ steps.stage.outputs.check }}
        run: |
          expected=$(sha256sum dist/DianaWidget.bundle.js | cut -d' ' -f1)
          urls=$(for host in $CDN_URL $BASE_URL; do for f in $FILES; do echo "$host/dist/$f"; done; done | sort -u)
          for url in $urls; do
            ok=false
            for i in 1 2 3 4 5 6; do
              actual=$( (curl -fsSL "$url" || true) | sha256sum | cut -d' ' -f1)
              if [ "$actual" = "$expected" ]; then ok=true; break; fi
              echo "attempt $i: $url does not serve the new build yet"
              sleep 10
            done
            if [ "$ok" != true ]; then
              echo "::error::$url does not serve the deployed build"
              exit 1
            fi
            echo "OK $url"
          done

      - name: CDN landing page check
        if: env.CHANNEL == 'production'
        env:
          VERSION: ${{ steps.stage.outputs.version }}
        run: |
          url="$CDN_URL/"
          for i in 1 2 3 4 5 6; do
            if (curl -fsSL "$url" || true) | grep -qF "data-current=\"$VERSION\""; then echo "OK $url"; exit 0; fi
            echo "attempt $i: $url does not show v$VERSION yet"
            sleep 10
          done
          echo "::error::$url does not show v$VERSION"
          exit 1

      # production: the demo page must render through PHP and load the deployed bundle.
      # dev: the dev pages must stay behind the password (401), never public.
      - name: Demo check
        run: |
          if [ "$CHANNEL" = production ]; then
            url="$DEMO_URL"
            if curl -fsSL "$url" | grep -qF "src=\"$BASE_URL/dist/DianaWidget.bundle.js\""; then
              echo "OK $url"
            else
              echo "::error::$url does not serve the demo"
              exit 1
            fi
          else
            for f in index-dev.php index-demo-dev.html; do
              url="${DEMO_URL%/}/$f"
              status=$(curl -s -o /dev/null -w '%{http_code}' "$url")
              if [ "$status" != 401 ]; then
                echo "::error::$url answers $status instead of 401: the dev demo is not password-protected"
                exit 1
              fi
              echo "OK $url (401)"
            done
          fi

      - name: Attach bundle to the GitHub Release
        if: env.CHANNEL == 'production' && startsWith(inputs.ref, 'v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.stage.outputs.version }}
        run: gh release upload "$REF" "dist/DianaWidget.bundle-$VERSION.js" --clobber

      - name: Summary
        env:
          FILES: ${{ steps.stage.outputs.check }}
          VERSION: ${{ steps.stage.outputs.version }}
          COMMIT: ${{ steps.stage.outputs.commit }}
        run: |
          {
            echo "## Deployed $CHANNEL: v$VERSION (commit ${COMMIT:0:7}, ref $REF)"
            for f in $FILES; do echo "- $BASE_URL/dist/$f (CDN: $CDN_URL/dist/$f)"; done
            if [ "$CHANNEL" = production ]; then echo "- CDN landing page: $CDN_URL/"; fi
            if [ "$CHANNEL" = production ]; then echo "- demo: $DEMO_URL"; else echo "- dev demo: ${DEMO_URL%/}/index-dev.php"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v5
        with:
          name: diana-widget-${{ inputs.channel }}-${{ steps.stage.outputs.version }}
          path: dist/
